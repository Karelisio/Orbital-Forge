name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.1). Empty = latest tag, artifacts only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Resolve version from tag
        id: version
        run: node scripts/version-from-tag.mjs --github-output ${{ github.event.inputs.tag && format('--tag {0}', github.event.inputs.tag) || '' }}

      - name: Build web app (Vite)
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release
          NAME="orbital-forge-${{ steps.version.outputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/$NAME.aab"
          ls -la release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs release/*.apk | head -5

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT="${{ steps.version.outputs.tag }}"
          # On a manual run the tag may not exist yet: it is created by the release step on this commit.
          HEAD_REF="$CURRENT"
          git rev-parse -q --verify "refs/tags/$CURRENT" >/dev/null || HEAD_REF=HEAD
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$HEAD_REF^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then RANGE="$PREVIOUS..$HEAD_REF"; else RANGE="$HEAD_REF"; fi
          {
            echo "## Orbital Forge $CURRENT"
            echo
            echo "versionName \`${{ steps.version.outputs.name }}\` · versionCode \`${{ steps.version.outputs.code }}\`"
            echo
            echo "### Changements"
            git log "$RANGE" --no-merges --pretty='- %s (%h)' 2>/dev/null || git log --no-merges --pretty='- %s (%h)' -n 50
          } > release/CHANGELOG.md
          cat release/CHANGELOG.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbital-forge-${{ steps.version.outputs.tag }}
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Orbital Forge ${{ steps.version.outputs.tag }}
          body_path: release/CHANGELOG.md
          files: |
            release/*.apk
            release/*.aab
